    <path class="o" d="M296 302C296 228 504 228 504 302Z" fill="#e6b450"/>
    <rect class="o" x="280" y="296" width="240" height="22" rx="11" fill="#c8942f"/>
    <circle cx="400" cy="264" r="17" fill="#10121a" stroke="#07080b" stroke-width="4"/>
    <path d="M392 264l6 6 11-13" fill="none" stroke="#e6b450" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

