<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 20 700 940" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .o { stroke: #07080b; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
    .t { font-family: Arial, Helvetica, sans-serif; font-weight: 700; }
  </style>
  <defs>
    <path id="spark" d="M0-15Q0 0 15 0Q0 0 0 15Q0 0-15 0Q0 0 0-15Z"/>
  </defs>


  <g fill="#f6d58a">
    <use href="#spark" transform="translate(110 470) scale(1)" opacity=".8"/>
    <use href="#spark" transform="translate(705 450) scale(.8)" opacity=".7"/>
    <use href="#spark" transform="translate(170 140) scale(.6)" opacity=".6"/>
    <use href="#spark" transform="translate(700 590) scale(.55)" opacity=".5"/>
