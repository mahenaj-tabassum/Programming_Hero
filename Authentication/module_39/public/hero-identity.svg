    <circle cx="400" cy="654" r="24" fill="#e6b450" stroke="#07080b" stroke-width="4"/>
    <circle cx="400" cy="650" r="6" fill="#07080b"/><path d="M396 654h8l3 16h-14z" fill="#07080b"/>

