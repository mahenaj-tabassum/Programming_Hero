    <rect class="o" x="599" y="470" width="26" height="14" rx="3" fill="#e6b450"/>
    <rect class="o" x="599" y="494" width="19" height="14" rx="3" fill="#e6b450"/>
    <rect class="o" x="585" y="360" width="14" height="175" rx="6" fill="#e6b450"/>
    <circle class="o" cx="592" cy="335" r="40" fill="#e6b450"/>
    <circle cx="592" cy="335" r="17" fill="#10121a" stroke="#07080b" stroke-width="4"/>
    <circle class="o" cx="592" cy="535" r="27" fill="#f2c25f"/>

    <!-- arm holding the shield -->
    <path d="M296 565L232 628" stroke="#07080b" stroke-width="54" stroke-linecap="round"/>
    <path d="M296 565L232 628" stroke="#343b4f" stroke-width="42" stroke-linecap="round"/>
    <g transform="translate(168 648) scale(6.4) translate(-12 -12)">
