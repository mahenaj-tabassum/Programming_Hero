    <ellipse class="o" cx="358" cy="845" rx="48" ry="23" fill="#e6b450"/>
    <ellipse class="o" cx="442" cy="845" rx="48" ry="23" fill="#e6b450"/>

    <!-- torso and chest panel -->
    <rect class="o" x="285" y="515" width="230" height="250" rx="72" fill="#343b4f"/>
    <rect x="335" y="572" width="130" height="122" rx="28" fill="#222736" stroke="#07080b" stroke-width="4"/>
