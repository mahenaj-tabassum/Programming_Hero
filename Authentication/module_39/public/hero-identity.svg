    <circle class="o" cx="538" cy="398" r="22" fill="#e6b450"/>
    <rect class="o" x="268" y="290" width="264" height="212" rx="82" fill="#3d4560"/>
    <path d="M292 340Q300 312 332 306" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="7" stroke-linecap="round"/>
    <rect x="300" y="332" width="200" height="130" rx="54" fill="#0c0d12" stroke="#07080b" stroke-width="4"/>
    <ellipse cx="356" cy="390" rx="17" ry="23" fill="#f6d58a"/><ellipse cx="444" cy="390" rx="17" ry="23" fill="#f6d58a"/>
    <circle cx="350" cy="381" r="6" fill="#fff7e0"/><circle cx="438" cy="381" r="6" fill="#fff7e0"/>
