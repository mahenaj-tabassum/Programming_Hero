      <path d="M8.5 12l2.5 2.5 4.5-5" fill="none" stroke="#07080b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle class="o" cx="226" cy="640" r="27" fill="#f2c25f"/>

